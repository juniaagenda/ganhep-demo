<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>GANHeP Admin</title>
<style>
:root{--navy:#0a2f6b;--blue:#1565c0;--gold:#1f8a4c;--bg:#f5f7fb;--tx:#1b2438;--mut:#5d6a85;--bd:#d7dde9;--ok:#1d7a46;--bad:#b3261e}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header b{letter-spacing:1px}main{max-width:1060px;margin:auto;padding:16px 14px 60px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:#fff;border-radius:8px;font:inherit;font-weight:700;color:var(--navy);cursor:pointer}.tabs button.on{background:var(--navy);color:#fff}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}h2,h3{color:var(--navy);margin:0 0 8px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;font:inherit;margin:3px 0 8px;background:#fff;color:var(--tx)}label{font-size:13px;font-weight:600;display:block}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}.btn.g{background:var(--gold);color:#fff}.btn.o{background:#fff;color:var(--blue);border:1px solid var(--blue)}.btn.r{background:var(--bad)}.btn.s{padding:4px 9px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.bar input,.bar select{width:auto;flex:1;min-width:150px;margin:0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--mut);text-transform:uppercase}
.tag{padding:1px 8px;border-radius:12px;font-size:12px;font-weight:700;border:1px solid currentColor}.Pending{color:#a87f00}.Approved{color:var(--ok)}.Rejected{color:var(--bad)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 12px}.row{border:1px dashed var(--bd);border-radius:8px;padding:10px;margin-bottom:8px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;overflow:auto;padding:16px;z-index:20}#modal.on{display:block}#modal .card{max-width:760px;margin:auto}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 18px;border-radius:20px;display:none}
#login{max-width:340px;margin:60px auto}.hide{display:none!important}#rec{display:none}
@media print{body>*:not(#rec){display:none!important}#rec{display:block;padding:20px;font-family:Georgia,serif;color:#000}#rec h1{color:#1565c0;border-bottom:3px solid #1f8a4c}#rec td{border:1px solid #bbb;padding:6px}}
</style></head><body>
<header><b>GANHeP · Admin</b><span><a href="/" style="color:#fff">View site</a> <button class="btn g s hide" id="out">Log out</button></span></header>
<main>
<div id="login" class="card"><h2>Administrator login</h2><label>Password<input type="password" id="pw" autocomplete="current-password"></label><div id="le" style="color:var(--bad);font-size:13px"></div><button class="btn" id="lb">Log in</button></div>
<div id="app" class="hide"><div class="tabs"><button class="on" data-t="mem">Members</button><button data-t="con">Site content</button></div>
<div id="mem"><div class="card"><div id="stats" style="color:var(--mut)"></div><div class="bar"><input id="q" placeholder="Search name, ID, church, phone…"><select id="sf"><option value="">All statuses</option><option>Pending</option><option>Approved</option><option>Rejected</option></select><button class="btn g" id="xl">Export Excel</button></div>
<div class="tw"><table><thead><tr><th>Member ID</th><th>Name</th><th>Phone</th><th>Church</th><th>Practice</th><th>Status</th><th>Actions</th></tr></thead><tbody id="tb"></tbody></table></div></div></div>
<div id="con" class="hide"><div class="card"><div id="ce"></div><button class="btn g" id="sv">Save &amp; publish changes</button></div></div></div>
</main>
<div id="modal"><div class="card"><h2>Edit member</h2><form id="ef" novalidate></form></div></div><div id="toast"></div><div id="rec"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const F=[["Personal",[["regDate","Registration date","date"],["fullName","Full name","text"],["gender","Gender","select:Male,Female"],["dob","Date of birth","date"],["phone","Phone","tel"],["email","Email","email"],["address","Residence / town","text"]]],
["Professional",[["qualification","Qualification","text"],["specialty","Area of practice","select:Naturopathy,Herbal medicine,Hydrotherapy,Nutrition & lifestyle,Nursing,Allied health,Other"],["years","Years of experience","number"],["workplace","Clinic / workplace","text"],["licence","Licence no.","text"]]],
["Church",[["church","Local church","text"],["district","District / Conference","text"],["mstatus","Membership status","select:Baptised SDA member,Not yet baptised"],["office","Church office","text"],["pastor","Referee","text"]]]];
const ALL=F.flatMap(s=>s[1]),$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let T=sessionStorage.getItem("t"),M=[],C=null;
const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",3000)};
async function api(path,method="GET",body){const r=await fetch("/api/"+path,{method,headers:{"Content-Type":"application/json",Authorization:"Bearer "+T},body:body?JSON.stringify(body):undefined});if(r.status===401&&path!=="login"){logout();throw new Error("Session expired")}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Error");return j}
function logout(){sessionStorage.removeItem("t");T=null;$("#app").classList.add("hide");$("#out").classList.add("hide");$("#login").classList.remove("hide")}
$("#out").onclick=logout;
$("#lb").onclick=async()=>{$("#le").textContent="";try{const j=await api("login","POST",{password:$("#pw").value});T=j.token;sessionStorage.setItem("t",T);$("#pw").value="";start()}catch(e){$("#le").textContent=e.message}};
$("#pw").onkeydown=e=>{if(e.key==="Enter")$("#lb").click()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));$("#mem").classList.toggle("hide",b.dataset.t!=="mem");$("#con").classList.toggle("hide",b.dataset.t!=="con")});
async function start(){$("#login").classList.add("hide");$("#app").classList.remove("hide");$("#out").classList.remove("hide");try{await loadM();C=await (await fetch("/api/content")).json();renderC()}catch(e){toast(e.message)}}
async function loadM(){M=await api("members");viewM()}
const rows=()=>{const q=$("#q").value.toLowerCase(),sf=$("#sf").value;return M.filter(r=>(!sf||r.status===sf)&&(!q||(r.memberId+" "+ALL.map(f=>r[f[0]]).join(" ")).toLowerCase().includes(q))).sort((a,b)=>(b.submittedAt||"").localeCompare(a.submittedAt||""))};
function viewM(){const c=s=>M.filter(r=>r.status===s).length;$("#stats").textContent=`${M.length} registered · ${c("Pending")} pending · ${c("Approved")} approved · ${c("Rejected")} rejected`;
$("#tb").innerHTML=rows().map(r=>`<tr><td>${esc(r.memberId||"—")}</td><td>${esc(r.fullName)}</td><td>${esc(r.phone)}</td><td>${esc(r.church)}</td><td>${esc(r.specialty)}</td><td><span class="tag ${r.status}">${r.status}</span></td><td>${[["edit","Edit","o"],["pdf","PDF","o"],r.status!=="Approved"?["Approved","Approve",""]:null,r.status!=="Rejected"?["Rejected","Reject","r"]:null,["del","Delete","r"]].filter(Boolean).map(a=>`<button class="btn s ${a[2]}" data-a="${a[0]}" data-id="${r.id}">${a[1]}</button>`).join(" ")}</td></tr>`).join("")||'<tr><td colspan="7">No members found.</td></tr>'}
$("#q").oninput=$("#sf").onchange=viewM;
$("#tb").onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;const id=b.dataset.id,a=b.dataset.a,r=M.find(x=>x.id===id);try{
if(a==="edit"){$("#ef").innerHTML=F.map(s=>`<h3>${s[0]}</h3><div class="fg">${s[1].map(([k,l,t])=>`<label>${l}${t.startsWith("select:")?`<select name="${k}">${t.slice(7).split(",").map(o=>`<option${r[k]===o?" selected":""}>${o}</option>`).join("")}</select>`:`<input name="${k}" type="${t}" value="${esc(r[k])}">`}</label>`).join("")}</div>`).join("")+'<button class="btn" type="submit">Save</button> <button class="btn o" type="button" id="cx">Cancel</button>';$("#ef").dataset.id=id;$("#modal").classList.add("on");$("#cx").onclick=()=>$("#modal").classList.remove("on")}
else if(a==="pdf")printRec(r);
else if(a==="del"){if(confirm("Permanently delete this member record?")){await api("members/"+id,"DELETE");await loadM();toast("Deleted")}}
else{const j=await api("members/"+id+"/status","POST",{status:a});await loadM();toast(a+(j.memberId?" · "+j.memberId:""))}}catch(x){toast(x.message)}};
$("#ef").onsubmit=async e=>{e.preventDefault();const d={};ALL.forEach(([k])=>d[k]=e.target.elements[k].value);try{await api("members/"+e.target.dataset.id,"PUT",d);$("#modal").classList.remove("on");await loadM();toast("Saved")}catch(x){toast(x.message)}};
function printRec(r){$("#rec").innerHTML=`<h1>GANHeP Membership Registration Record</h1><p>Ghana Adventist Natural Health Practitioners</p><p><b>Member ID:</b> ${esc(r.memberId||"—")} &nbsp; <b>Status:</b> ${r.status}</p>`+F.map(s=>`<h3>${s[0]} Information</h3><table style="width:100%;border-collapse:collapse">${s[1].map(f=>`<tr><td style="width:38%"><b>${f[1]}</b></td><td>${esc(r[f[0]])}</td></tr>`).join("")}</table>`).join("")+'<p style="margin-top:40px">Admin signature: ____________________ &nbsp; Date: __________</p>';setTimeout(print,50)}
$("#xl").onclick=()=>{const d=[["Member ID","Status",...ALL.map(f=>f[1])],...rows().map(r=>[r.memberId,r.status,...ALL.map(f=>r[f[0]]??"")])];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(d),"Register");XLSX.writeFile(wb,"GANHeP-register.xlsx")};
/* ---- Site content editor ---- */
const LISTS={leaders:["Leadership",[["name","Name"],["role","Position"]],{name:"",role:"",photo:""},1],programmes:["Programmes",[["title","Title"],["body","Description","t"]],{title:"",body:""}],news:["News & events",[["date","Date"],["title","Headline"],["body","Details","t"]],{date:"",title:"",body:""}],resources:["Resources",[["title","Title"],["url","Link (optional, https://…)"]],{title:"",url:"",fileId:"",fileName:""},0,1],social:["Social media",[["label","Platform (e.g. Facebook)"],["url","Page link (https://…)"]],{label:"",url:""}],links:["Other links",[["label","Link name"],["url","Link (https://…)"]],{label:"",url:""}]};
const inp=(p,l,v,t)=>`<label>${l}${t?`<textarea rows="3" data-p="${p}">${esc(v)}</textarea>`:`<input data-p="${p}" value="${esc(v)}">`}</label>`;
function renderC(){let h="<h2>Pages</h2>"+[["mission","Mission"],["vision","Vision"],["whoWeAre","About: who we are"],["whatWeDo","About: what we do"],["affiliation","About: affiliation"]].map(([k,l])=>inp(k,l,C[k],1)).join("")+'<h3>Contact</h3><div class="fg">'+[["address","Address"],["phone","Phone"],["email","Email"]].map(([k,l])=>inp("contact."+k,l,C.contact[k])).join("")+"</div>";
for(const [k,[title,fs,,photo,file]] of Object.entries(LISTS)){h+=`<h3 style="margin-top:14px">${title}</h3>`+C[k].map((it,i)=>`<div class="row">${fs.map(([f,l,t])=>inp(`${k}.${i}.${f}`,l,it[f],t)).join("")}${photo?`<label>Photo<input type="file" accept="image/*" data-ph="${k}.${i}"></label>${it.photo?`<img src="${esc(it.photo)}" style="width:50px;height:50px;border-radius:50%;object-fit:cover">`:""}`:""}${file?`<label>Upload a file (PDF, Word, Excel, PowerPoint, JPG, PNG · max 4 MB)<input type="file" data-up="${k}.${i}"></label>${it.fileName?`<div style="font-size:13px;color:var(--mut);margin-bottom:6px">Current file: ${esc(it.fileName)}</div>`:""}`:""}<button class="btn r s" data-rm="${k}.${i}" type="button">Remove</button></div>`).join("")+`<button class="btn o s" data-add="${k}" type="button">+ Add</button>`}
$("#ce").innerHTML=h}
function setP(p,v){const a=p.split(".");let o=C;for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v}
$("#ce").oninput=e=>{if(e.target.dataset.p)setP(e.target.dataset.p,e.target.value)};
$("#ce").onclick=e=>{const b=e.target;if(b.dataset.add){C[b.dataset.add].push({...LISTS[b.dataset.add][2]});renderC()}if(b.dataset.rm){const [k,i]=b.dataset.rm.split(".");C[k].splice(+i,1);renderC()}};
$("#ce").onchange=async e=>{const u=e.target.dataset.up,f0=e.target.files[0];if(u&&f0){if(f0.size>4*1024*1024){toast("File is larger than 4 MB");e.target.value="";return}try{toast("Uploading…");const r=await fetch("/api/upload",{method:"POST",headers:{Authorization:"Bearer "+T,"X-Filename":encodeURIComponent(f0.name)},body:f0});const j=await r.json();if(!r.ok)throw new Error(j.error||"Upload failed");const [k,i]=u.split(".");C[k][+i].fileId=j.fileId;C[k][+i].fileName=j.fileName;renderC();toast("Uploaded. Click Save & publish to finish")}catch(x){toast(x.message)}return}const p=e.target.dataset.ph;if(!p||!e.target.files[0])return;const [k,i]=p.split("."),img=new Image();img.onload=()=>{const s=Math.min(1,320/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);C[k][+i].photo=c.toDataURL("image/jpeg",.8);renderC()};img.src=URL.createObjectURL(e.target.files[0])};
$("#sv").onclick=async()=>{try{await api("content","PUT",C);toast("Published ✓ Website updated")}catch(x){toast(x.message)}};
if(T)start();
</script></body></html>
